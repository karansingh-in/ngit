name: Build and Release ngit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: ngit-linux
            ext: deb

          - name: macOS
            os: macos-latest
            artifact: ngit-macos
            ext: dmg

          - name: Windows
            os: windows-latest
            artifact: ngit-windows
            ext: exe

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure WiX Toolset is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Installing WiX Toolset via Chocolatey..."
            choco install wixtoolset -y --no-progress
            $wixDir = (Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
            if ($wixDir -and (Test-Path "$wixDir\bin")) {
              "$wixDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              "$wixDir\bin" >> $env:PATH
            }
          }
          candle.exe -help | Select-Object -First 1

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.4"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ngit version $VERSION"

      - name: Compile Java source
        shell: bash
        run: |
          rm -rf out dist
          mkdir -p out dist
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 -d out @sources.txt

      - name: Create ngit JAR
        shell: bash
        run: |
          jar --create --file dist/ngit.jar --main-class ngit.Main -C out .

      - name: Test ngit
        shell: bash
        run: |
          java -jar dist/ngit.jar --help

      - name: Package Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jpackage \
            --type deb \
            --input dist \
            --name ngit \
            --main-jar ngit.jar \
            --main-class ngit.Main \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor "karansingh-in" \
            --description "A lightweight Git-like version control system written from scratch in Java" \
            --icon assets/ngit.png \
            --linux-package-name ngit \
            --linux-shortcut \
            --dest dist

      - name: Package macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          jpackage \
            --type dmg \
            --input dist \
            --name ngit \
            --main-jar ngit.jar \
            --main-class ngit.Main \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor "karansingh-in" \
            --description "A lightweight Git-like version control system written from scratch in Java" \
            --icon assets/ngit.icns \
            --dest dist

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Clean out any conflicting override files
          Remove-Item -Path wix-resources\override*.wxi* -Force -ErrorAction SilentlyContinue

          # Retarget absolute Source paths inside bundle.wxf to runner workspace
          (Get-Content wix-resources\bundle.wxf) -replace '(?i)[a-z]:\\.+?\\wixtemp', "$PWD\wixtemp" | Set-Content wix-resources\bundle.wxf

          jpackage `
            --type exe `
            --input dist `
            --name ngit `
            --main-jar ngit.jar `
            --main-class ngit.Main `
            --app-version "${{ steps.version.outputs.version }}" `
            --vendor "karansingh-in" `
            --description "A lightweight Git-like version control system written from scratch in Java" `
            --icon assets\ngit.ico `
            --win-console `
            --resource-dir wix-resources `
            --temp wixtemp `
            --dest dist

      - name: Show build output
        shell: bash
        run: |
          echo "Generated files:"
          ls -lah dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: ngit-linux
          path: release

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: ngit-macos
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ngit-windows
          path: release

      - name: Show release files
        shell: bash
        run: |
          echo "Release assets:"
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.4' }}
          files: release/*
          generate_release_notes: true
          name: ngit ${{ github.ref_name }}
          body: |
            # ngit ${{ github.ref_name }}

            A lightweight, Git-like version control system built from scratch in Java.

            ## Downloads

            - **Linux:** `.deb`
            - **macOS:** `.dmg`
            - **Windows:** `.exe` (adds ngit to PATH automatically)

            ## Built by

            Karan Singh  
            GitHub: https://github.com/karansingh-in