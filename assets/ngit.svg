<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="240" height="240" rx="48" fill="#111111"/>

  <!-- main trunk line -->
  <line x1="80" y1="60" x2="80" y2="180" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round"/>

  <!-- branch line curving out and back -->
  <path d="M80 100 C 80 130, 160 110, 160 140 C 160 150, 160 150, 160 150"
        fill="none" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round"/>

  <!-- commit nodes on trunk -->
  <circle cx="80" cy="60" r="14" fill="#111111" stroke="#F5F5F5" stroke-width="8"/>
  <circle cx="80" cy="100" r="14" fill="#111111" stroke="#F5F5F5" stroke-width="8"/>
  <circle cx="80" cy="180" r="14" fill="#111111" stroke="#F5F5F5" stroke-width="8"/>

  <!-- commit node on branch -->
  <circle cx="160" cy="150" r="14" fill="#111111" stroke="#F5F5F5" stroke-width="8"/>
</svg>
